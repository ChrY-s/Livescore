services:

  app:
    build: .
    container_name: livescore_tornado
    depends_on:
      - mongo
    ports:
      - "8888:8888"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: livescore_db
    networks:
      - apinet


  mongo:
    image: mongo:latest
    container_name: livescore_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - apinet

volumes:
  mongo_data:

networks:
  apinet:
    driver: bridge